
name: Gerar APK ZYON PRIVATE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - run: unzip ZYON_PRIVATE_GitHub_Build.zip

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p ZYON_PRIVATE_Android :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ZYON-PRIVATE-APK
          path: ZYON_PRIVATE_Android/app/build/outputs/apk/debug/app-debug.apk
          
